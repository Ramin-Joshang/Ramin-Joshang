<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b2e"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="waveF1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.3"/>
