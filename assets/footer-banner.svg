    </linearGradient>
    <linearGradient id="waveF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00eaff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00eaff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="130" fill="url(#bgGradF)"/>
  <path d="M0,30 C150,55 300,10 450,30 C600,50 750,15 900,35 L900,0 L0,0 Z" fill="url(#waveF1)">
