# Save this file as: .github/workflows/snake.yml
# in your Ramin-Joshang/Ramin-Joshang profile repo.
#
# Generates the animated "snake eating your contribution graph" SVG and
# pushes it to an `output` branch. No secrets needed - uses the default
# GITHUB_TOKEN. Runs on GitHub's own infrastructure, so it won't be
# affected by third-party outages.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Ramin-Joshang
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
