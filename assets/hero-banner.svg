<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="55%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#140b2e"/>
    </linearGradient>
    <linearGradient id="neonSweep" x1="-60%" y1="0%" x2="0%" y2="0%" spreadMethod="reflect">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-300 0; 300 0; -300 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur">
        <animate attributeName="stdDeviation" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00eaff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00eaff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2fd0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff2fd0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="230" fill="url(#bgGrad)"/>
  
    <circle cx="40" cy="240" r="3.2" fill="#00eaff" opacity="0">
      <animate attributeName="cy" values="240;-10" dur="6s" begin="-0.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="6s" begin="-0.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="240" r="4.6" fill="#ff2fd0" opacity="0">
