# Save this file as: .github/workflows/metrics.yml
# in your Ramin-Joshang/Ramin-Joshang profile repo.
#
# It generates a rich, self-updating dashboard SVG (isometric contribution
# calendar, coding habits, achievements, star history, and more) and commits
# it back to your repo as github-metrics.svg, which the README embeds.
#
# Requires one repo secret: METRICS_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret)
# Value: a Personal Access Token (classic, scope: repo) — this needs to be
# a PAT rather than the default GITHUB_TOKEN because several plugins below
# (achievements, isocalendar, etc.) query beyond this single repo.

name: Update Metrics Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "chore: update metrics dashboard [skip ci]"

          # ---- Base ----
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tehran

          # ---- Plugins ----
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14

          plugin_stars: yes
          plugin_stars_limit: 6

          plugin_lines: yes

          plugin_traffic: yes
