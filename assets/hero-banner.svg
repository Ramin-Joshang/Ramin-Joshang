  <g>
    <path d="M0,190 C150,160 300,215 450,190 C600,165 750,210 900,185 L900,230 L0,230 Z" fill="url(#wave1)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-25 0;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0,205 C180,180 320,225 480,205 C640,185 760,220 900,200 L900,230 L0,230 Z" fill="url(#wave2)">
